<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';connect-src 'self';img-src 'self' data:;object-src 'none';base-uri 'none';form-action 'self';frame-ancestors 'none';upgrade-insecure-requests"><title>Vault</title><link rel="stylesheet" href="/app.css"></head><body><main class="shell"><section class="card"><h1>Vault created</h1><p class="muted">The encrypted vault is stored in Cloudflare D1. The server cannot decrypt its contents.</p><p><strong>Vault ID</strong></p><input id="id" readonly><p class="warning">Save the Vault ID separately. It is not a master password or recovery key.</p><button id="lock">Lock</button></section></main><script>const id=sessionStorage.getItem("iknow_vault_id");if(!id)location.href="/";else document.querySelector("#id").value=id;document.querySelector("#lock").onclick=()=>{sessionStorage.clear();location.href="/"};</script></body></html>
