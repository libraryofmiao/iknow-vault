<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"><title>Vault — iKnow</title><link rel="stylesheet" href="/app.css"></head><body><main class="shell"><section class="card vault-card"><div class="top"><div><h1>iKnow Vault</h1><p id="state" class="muted">Locked</p></div><button id="lock" class="secondary" type="button">Lock</button></div><div id="unlock"><label>Master password<input id="master" type="password" autocomplete="current-password"></label><button id="unlockBtn" type="button">Unlock vault</button><p id="unlockMsg" class="muted" role="status"></p></div><div id="content" hidden><div class="toolbar"><input id="search" placeholder="Search entries…" autocomplete="off"><button id="add" type="button">Add entry</button><button id="backup" class="secondary" type="button">Encrypted backup</button><button id="restore" class="secondary" type="button">Restore</button><button id="changePassword" class="secondary" type="button">Change master password</button><input id="restoreFile" type="file" accept=".iknow,.json,application/json" hidden></div><div id="list" class="list"></div><p id="saveMsg" class="muted" role="status"></p></div></section></main><dialog id="editor"><form method="dialog" id="itemForm" class="dialog-card"><h2>Add / edit entry</h2><input type="hidden" id="itemId"><label>Title<input id="title" required maxlength="120"></label><label>Username<input id="username" maxlength="200" autocomplete="off"></label><label>Password<div class="password-row"><input id="secret" type="password" maxlength="500" autocomplete="new-password"><button type="button" id="gen" class="secondary">Generate</button></div></label><label>Website / URL<input id="url" maxlength="500" autocomplete="off"></label><label>Notes<textarea id="notes" maxlength="3000"></textarea></label><div class="actions"><button type="button" id="cancel" class="secondary">Cancel</button><button type="submit">Save encrypted entry</button></div></form></dialog><dialog id="passwordDialog"><form method="dialog" id="passwordForm" class="dialog-card"><h2>Change master password</h2><p class="muted">The vault is re-encrypted in your browser. Your current password is never sent to the server.</p><label>New master password<input id="newMaster" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><p id="passwordStrength" class="muted" role="status"></p><label>Confirm new password<input id="newMasterConfirm" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><p id="passwordMsg" class="muted" role="status"></p><div class="actions"><button type="button" id="passwordCancel" class="secondary">Cancel</button><button type="submit">Change password</button></div></form></dialog></form></dialog><script src="/vault.js" defer></script></body></html>
